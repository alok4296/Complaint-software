<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Categories | Complaint Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="d-flex">
      <aside class="sidebar p-3">
        <h3 class="mb-4 fw-bold">Complaint Portal</h3>
        <nav class="nav flex-column gap-2">
          <a class="nav-link" href="admin-dashboard.html">Dashboard</a>
          <a class="nav-link" href="manage-users.html">Manage Users</a>
          <a class="nav-link active" href="manage-categories.html">Manage Categories</a>
          <button id="logoutButton" class="btn btn-outline-light mt-3">Logout</button>
        </nav>
      </aside>
      <main class="main-content p-4">
        <div class="card p-4">
          <h3 class="fw-bold mb-3">Categories</h3>
          <form id="categoryForm" class="row g-2 mb-4">
            <div class="col-md-5">
              <input type="text" id="categoryName" class="form-control" placeholder="Category name" required />
            </div>
            <div class="col-md-5">
              <input type="text" id="categoryDescription" class="form-control" placeholder="Description" />
            </div>
            <div class="col-md-2">
              <button type="submit" class="btn btn-primary w-100">Add</button>
            </div>
          </form>
          <div id="categoryList" class="list-group"></div>
        </div>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/manage-categories.js"></script>
  </body>
</html>
