<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | Complaint Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="d-flex">
      <aside class="sidebar p-3">
        <h3 class="mb-4 fw-bold">Complaint Portal</h3>
        <nav class="nav flex-column gap-2">
          <a class="nav-link active" href="admin-dashboard.html">Dashboard</a>
          <a class="nav-link" href="manage-users.html">Manage Users</a>
          <a class="nav-link" href="manage-categories.html">Manage Categories</a>
          <a class="nav-link" href="student-dashboard.html">Student View</a>
          <button id="logoutButton" class="btn btn-outline-light mt-3">Logout</button>
        </nav>
      </aside>

      <main class="main-content p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h2>Admin Dashboard</h2>
            <p class="text-muted mb-0">Welcome back, administrator</p>
          </div>
        </div>

        <div class="row g-3 mb-4" id="adminStatCards"></div>

        <div class="card p-3 mb-4">
          <h5 class="fw-bold mb-3">Complaint Overview</h5>
          <canvas id="complaintsChart" height="120"></canvas>
        </div>

        <div class="card p-3">
          <h5 class="fw-bold mb-3">Recent Complaints</h5>
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Student</th>
                  <th>Category</th>
                  <th>Priority</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="adminComplaintTable"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/app.js"></script>
    <script src="js/admin-dashboard.js"></script>
  </body>
</html>
