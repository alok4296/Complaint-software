<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Complaint Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body class="bg-light d-flex align-items-center min-vh-100">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
          <div class="card shadow border-0 rounded-4">
            <div class="card-body p-4 p-md-5">
              <h2 class="text-center fw-bold mb-3">Login</h2>
              <p class="text-muted text-center mb-4">Access your complaint dashboard</p>

              <form id="loginForm">
                <div class="mb-3">
                  <label class="form-label">Email</label>
                  <input type="email" id="email" class="form-control" required />
                </div>

                <div class="mb-3">
                  <label class="form-label">Password</label>
                  <input type="password" id="password" class="form-control" required />
                </div>

                <button type="submit" class="btn btn-primary w-100">Login</button>
              </form>

              <div class="mt-3 text-center small text-muted">
                Need an account? <a href="register.html">Register here</a>
              </div>
              <div class="mt-4 p-3 bg-light rounded">
                <strong>Demo accounts:</strong>
                <div class="small mt-2">Admin: admin@college.edu / Admin@123</div>
                <div class="small">Staff: staff1@college.edu / Staff@123</div>
                <div class="small">Student: student1@college.edu / Student@123</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
