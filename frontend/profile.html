<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | Complaint Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="d-flex">
      <aside class="sidebar p-3">
        <h3 class="mb-4 fw-bold">Complaint Portal</h3>
        <nav class="nav flex-column gap-2">
          <a class="nav-link" href="student-dashboard.html">Dashboard</a>
          <a class="nav-link" href="submit-complaint.html">Submit Complaint</a>
          <a class="nav-link" href="my-complaints.html">My Complaints</a>
          <a class="nav-link" href="notifications.html">Notifications</a>
          <a class="nav-link active" href="profile.html">Profile</a>
          <button id="logoutButton" class="btn btn-outline-light mt-3">Logout</button>
        </nav>
      </aside>

      <main class="main-content p-4">
        <div class="card p-4">
          <h3 class="fw-bold mb-4">Profile</h3>
          <form id="profileForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Name</label>
                <input type="text" id="profileName" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" id="profileEmail" class="form-control" readonly />
              </div>
              <div class="col-md-6">
                <label class="form-label">Phone</label>
                <input type="text" id="profilePhone" class="form-control" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Roll Number</label>
                <input type="text" id="profileRollNumber" class="form-control" />
              </div>
            </div>
            <button class="btn btn-primary mt-4" type="submit">Update Profile</button>
          </form>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/profile.js"></script>
  </body>
</html>
