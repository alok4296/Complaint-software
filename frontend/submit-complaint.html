<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Submit Complaint | Complaint Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="d-flex">
      <aside class="sidebar p-3">
        <h3 class="mb-4 fw-bold">Complaint Portal</h3>
        <nav class="nav flex-column gap-2">
          <a class="nav-link" href="student-dashboard.html">Dashboard</a>
          <a class="nav-link active" href="submit-complaint.html">Submit Complaint</a>
          <a class="nav-link" href="my-complaints.html">My Complaints</a>
          <a class="nav-link" href="notifications.html">Notifications</a>
          <a class="nav-link" href="profile.html">Profile</a>
          <button id="logoutButton" class="btn btn-outline-light mt-3">Logout</button>
        </nav>
      </aside>

      <main class="main-content p-4">
        <div class="card p-4">
          <h3 class="fw-bold mb-4">Submit New Complaint</h3>
          <form id="complaintForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Complaint Title</label>
                <input type="text" id="title" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Category</label>
                <select id="category" class="form-select" required></select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Department</label>
                <select id="department" class="form-select" required></select>
              </div>
              <div class="col-md-6">
                <label class="form-label">Location</label>
                <input type="text" id="location" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Priority</label>
                <select id="priority" class="form-select" required>
                  <option value="Low">Low</option>
                  <option value="Medium" selected>Medium</option>
                  <option value="High">High</option>
                  <option value="Critical">Critical</option>
                </select>
              </div>
              <div class="col-12">
                <label class="form-label">Description</label>
                <textarea id="description" class="form-control" rows="5" required></textarea>
              </div>
              <div class="col-12">
                <label class="form-label">Attachment</label>
                <input type="file" id="attachment" class="form-control" />
              </div>
            </div>
            <button type="submit" class="btn btn-primary mt-4">Submit Complaint</button>
          </form>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/submit-complaint.js"></script>
  </body>
</html>
