<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Complaints | Complaint Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="d-flex">
      <aside class="sidebar p-3">
        <h3 class="mb-4 fw-bold">Complaint Portal</h3>
        <nav class="nav flex-column gap-2">
          <a class="nav-link" href="student-dashboard.html">Dashboard</a>
          <a class="nav-link" href="submit-complaint.html">Submit Complaint</a>
          <a class="nav-link active" href="my-complaints.html">My Complaints</a>
          <a class="nav-link" href="notifications.html">Notifications</a>
          <a class="nav-link" href="profile.html">Profile</a>
          <button id="logoutButton" class="btn btn-outline-light mt-3">Logout</button>
        </nav>
      </aside>

      <main class="main-content p-4">
        <div class="card p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="fw-bold mb-0">My Complaints</h3>
            <input type="text" id="searchInput" class="form-control w-25" placeholder="Search complaint" />
          </div>
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Title</th>
                  <th>Category</th>
                  <th>Priority</th>
                  <th>Status</th>
                  <th>Date</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="complaintsTable"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script src="js/my-complaints.js"></script>
  </body>
</html>
